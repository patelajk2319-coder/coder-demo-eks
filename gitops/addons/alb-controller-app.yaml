apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alb-controller
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: https://aws.github.io/eks-charts
      chart: aws-load-balancer-controller
      targetRevision: 3.6.0
      helm:
        valueFiles:
          - $values/helm-chart/coder-stack/values/alb-controller/alb-controller.yaml
    - repoURL: https://github.com/patelajk2319-coder/coder-demo-eks.git
      targetRevision: gitops-migration
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
