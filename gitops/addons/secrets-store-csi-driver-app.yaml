apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-store-csi-driver
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts
      chart: secrets-store-csi-driver
      targetRevision: 1.6.1
      helm:
        valueFiles:
          - $values/helm-chart/coder-stack/values/secrets-store-csi-driver/secrets-store-csi-driver.yaml
    - repoURL: https://github.com/patelajk2319-coder/coder-demo-eks.git
      targetRevision: gitops-migration
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy: {}
