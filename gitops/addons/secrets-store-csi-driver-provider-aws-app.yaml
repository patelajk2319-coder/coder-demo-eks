# depends_on the driver above existing first — same as the Terraform
# resource it replaces; Argo CD has no native depends_on for Applications,
# so this is synced manually, after, during initial adoption (see README).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-store-csi-driver-provider-aws
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: https://aws.github.io/secrets-store-csi-driver-provider-aws
      chart: secrets-store-csi-driver-provider-aws
      targetRevision: 3.1.4
      helm:
        valueFiles:
          - $values/helm-chart/coder-stack/values/secrets-store-csi-driver-provider-aws/secrets-store-csi-driver-provider-aws.yaml
    - repoURL: https://github.com/patelajk2319-coder/coder-demo-eks.git
      targetRevision: gitops-migration
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
