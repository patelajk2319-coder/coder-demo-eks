# No explicit ordering vs. secrets-store-csi-driver — both are independent
# DaemonSets/Deployments sharing a hostPath CSI socket dir; the provider pod
# tolerates the driver starting in either order.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-store-csi-driver-provider-aws
  namespace: argocd
spec:
  project: platform
  sources:
    - repoURL: https://aws.github.io/secrets-store-csi-driver-provider-aws
      chart: secrets-store-csi-driver-provider-aws
      targetRevision: 3.1.4
      helm:
        valueFiles:
          - $values/helm-chart/coder-stack/values/secrets-store-csi-driver-provider-aws/secrets-store-csi-driver-provider-aws.yaml
    - repoURL: https://github.com/patelajk2319-coder/coder-demo-eks.git
      targetRevision: gitops-migration
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
