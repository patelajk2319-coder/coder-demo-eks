# The one Application Terraform applies directly (modules/addons/argocd.tf).
# Everything else under gitops/ is declared inside it via directory recurse.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/patelajk2319-coder/coder-demo-eks.git
    # Flip to "main" once this branch merges.
    targetRevision: gitops-migration
    path: gitops
    directory:
      recurse: true
      # bootstrap/* is Terraform-applied directly; addons/manifests/* is raw
      # manifest content referenced BY an Application (gp3-storageclass), not
      # something root itself should adopt — same for any future */manifests/*.
      exclude: "{bootstrap/*,*/manifests/*}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
