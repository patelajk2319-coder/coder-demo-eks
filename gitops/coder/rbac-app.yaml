apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coder-rbac
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/patelajk2319-coder/coder-demo-eks.git
    targetRevision: gitops-migration
    path: manifests/coder
  destination:
    server: https://kubernetes.default.svc
    namespace: coder
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
