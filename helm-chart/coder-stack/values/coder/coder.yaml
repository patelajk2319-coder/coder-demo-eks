# Coder Helm values — structural and static config only.
# All env vars (CODER_ACCESS_URL, CODER_PG_CONNECTION_URL, etc.) are
# injected by Terraform via yamlencode to avoid fragile positional set overrides.

coder:
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"

  # Coder's "Medium" tier (1-100 devs): 4 vCPU / 8Gi total, 2-3 replicas —
  # https://coder.com/explore/how-coder-works/control-plane. Split across 2.
  replicaCount: 2

  # Requests below limits (not Guaranteed QoS) so a rollout's extra surge
  # pod fits on the coderd pool — v2.36.5's chart has no strategy/maxSurge
  # setting, so this is the only way to give Kubernetes' default 25% surge
  # room to schedule without a 3rd node.
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
